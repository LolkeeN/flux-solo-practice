apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-solo-app-deployment
  namespace: default
  labels:
    app: flux-solo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flux-solo-app
  template:
    metadata:
      labels:
        app: flux-solo-app
    spec:
      containers:
        - name: flux-solo-app
          image: docker.io/lolkeenn/flux-solo-app:0.0.8 # {"$imagepolicy": "flux-system:flux-solo-app"}
          ports:
            - containerPort: 8080
