apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: flux-solo-app
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: flux-solo-app
  filterTags:
    pattern: "^(?P<timestamp>[0-9]{14})-[a-f0-9]{40}$"
    extract: "$timestamp"
  policy:
    numerical:
      order: asc
