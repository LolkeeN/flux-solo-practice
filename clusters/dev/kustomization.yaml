apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: test-app
spec:
  sourceRef:
    kind: GitRepository
    name: app
  path: ./infrastructure/apps/test-app/test
  interval: 5m
  prune: true

resources:
  - ./image-repository.yaml
  - ./image-policy.yaml
  - ./image-update-automation.yaml
